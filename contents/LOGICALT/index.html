<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送電世界 - LOGICALT</title>
<meta name="description" content="ドットで描く論理回路シミュレーター">
<meta property="og:type" content="website">
<meta property="og:title" content="送電世界 - LOGICALT">
<meta property="og:description" content="ドットで描く論理回路シミュレーター">
<meta property="og:image" content="https://tenomicromochi.github.io/images/OGP.png">
<meta property="og:url" content="https://tenomicromochi.github.io/contents/LOGICALT/index.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/main.css">
<script src="/menu.js" defer></script>
</head>
<body data-mode="STOP" data-tab="BUILD" data-layer="FRONT">

<!-- ============ CANVAS ============ -->
<div id="canvasStack">
  <canvas id="screen"></canvas>
  <div class="selsize" id="selSize" hidden></div>
  <div class="toast" id="toast"></div>
</div>

<!-- ============ DECK : BUILD / PLAY / FILE ============ -->
<div class="deck">
  <div class="tabs">
    <button class="tab" data-tab="BUILD" data-hint="BUILD  - DRAW AND EDIT. THE CIRCUIT IS AT ITS START STATE">BUILD</button>
    <button class="tab" data-tab="PLAY"  data-hint="PLAY  - RUN THE CIRCUIT. EDITING IS PUT AWAY">PLAY</button>
    <button class="tab" data-tab="FILE"  data-hint="FILE  - SAVE, LOAD, PARTS, RESET">FILE</button>
  </div>

  <!-- BUILD -->
  <div class="page" id="pBuild">
    <div class="grp"><h3>1. Pick a part</h3><div class="parts" id="parts"></div></div>
    <div class="grp" id="lampGrp"><h3>Color</h3><div class="lamps" id="lamps"></div></div>
    <div class="grp"><h3>2. How to draw</h3>
      <div id="shapes"></div>
      <div class="row" id="shapeOpt">
        <label id="autoCrossChk" data-hint="AUTO CROSS  - DRAWING STRAIGHT ACROSS A LINE PUTS A CROSS THERE (PEN / LINE)"><input type="checkbox" id="autoCross">Auto cross</label>
      </div>
    </div>
    <div class="grp"><h3>3. Change</h3>
      <div id="editRow"></div>
      <div class="row" id="editRow2"></div>
    </div>
    <div class="grp"><h3>Layer [Tab] &amp; view</h3>
      <div class="row"><span class="seg" id="layerSeg"></span></div>
      <div class="row"><span class="sub w">Other</span><div class="sld" id="otherSld"></div><span class="val" id="otherV"></span></div>
      <div class="row"><label data-hint="SHOW CONNECTIONS  - HIGHLIGHT WHAT THE CELL UNDER THE CURSOR CONNECTS TO"><input type="checkbox" id="netHl">Show connections</label></div>
      <div class="row"><label data-hint="GRID LINES (x4 AND ABOVE)"><input type="checkbox" id="gridOn">Grid</label>
        <input class="num g" id="gridW" maxlength="3" data-hint="GRID WIDTH  1 - 256"><span class="sub">x</span><input class="num g" id="gridH" maxlength="3" data-hint="GRID HEIGHT  1 - 256"></div>
    </div>
  </div>

  <!-- PLAY -->
  <div class="page" id="pPlay" hidden>
    <div class="grp big"><h3>Run</h3><div class="row" id="runRow"></div></div>
    <div class="grp"><h3>Speed (ticks / second)</h3>
      <div class="row"><div class="sld" id="tpsSld"></div><input class="num" id="tpsN" maxlength="4" data-hint="TICKS PER SECOND  1 - 2048"></div>
      <div class="row" id="tpsPresets"></div>
    </div>
    <div class="grp"><h3>How to play</h3><p class="sub">Click a T-FF (cyan) to flip it.<br>Shift+drag to select and copy.<br>Back to BUILD resets to the start.</p></div>
    <div class="grp"><h3>Look</h3><div class="row"><span class="sub w">Glow</span><span class="seg" id="glowSeg"></span></div></div>
    <div class="grp"><h3>Layer [Tab]</h3><div class="row"><span class="seg" id="layerSeg2"></span></div></div>
  </div>

  <!-- FILE -->
  <div class="page" id="pFile" hidden>
    <div class="cards" id="fileCards"></div>
  </div>
</div>

<!-- ============ STATUS ============ -->
<footer class="status" id="status">
  <button class="b deck-tgl" id="deckTgl" data-hint="CLOSE / OPEN THE PANEL  - MORE ROOM FOR THE CIRCUIT"></button>
  <span class="hint" id="hint"></span>
  <span id="stState" class="state"></span>
  <span id="stLayer" class="layer"></span>
  <span id="stUnknown" class="unknown" hidden></span>
  <span id="stXY"></span>
  <span id="stZoom"></span>
  <span id="stTick"></span>
  <span id="stSave"></span>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
