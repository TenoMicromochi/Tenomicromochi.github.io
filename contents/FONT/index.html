<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONT DISTRIBUTION</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/main.css">
    <script src="/menu.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="logo">FONT<em>DIST</em></div>
    <div class="tagline">original font distribution</div>
</header>

<div class="page-content">
    <h2 class="section-title">FONT DISTRIBUTION</h2>

    <div class="font-layout">
        <div class="font-list-area">
            <div class="label">FONT SELECT</div>
            <select id="font-selector" size="10">
                <option value="TenoText 3x6" selected>TenoText 3x6</option>
                <option value="TenoText 8x8">TenoText 8x8(Shift-JIS Kanji-Omit)</option>
                <option value="TenoText 8x10">TenoText 8x10</option>
                <option value="TenoText 8x11(+Extended ASCII)">TenoText 8x11</option>
                <option value="TenoText 7x13">TenoText 7x13(Shift-JIS Kanji-Omit)</option>
                <option value="TenoText 11x31">TenoText 11x31</option>
                <option value="TenoGlyph 4x4">TenoGlyph 4x4</option>
                <option value="TenoGlyph Magic">TenoGlyph Magic</option>
            </select>

            <div id="download-area">
                <button id="download-button" class="btn">DOWNLOAD</button>
            </div>
        </div>

        <div class="preview-area">
            <div class="label">PREVIEW</div>
            <div id="font-preview-display">The quick brown fox jumps over the lazy dog.</div>

            <div class="label" style="margin-top: 20px;">INPUT TEXT</div>
            <input type="text" id="preview-input" placeholder="ここに入力した文字が上でプレビューされるのです">
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
