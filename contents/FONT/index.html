<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送電世界 - FONT DISTRIBUTION</title>
    <meta name="description" content="てのくん自作フォントの配布">
    <meta property="og:type" content="website">
    <meta property="og:title" content="送電世界 - FONT DISTRIBUTION">
    <meta property="og:description" content="てのくん自作フォントの配布">
    <meta property="og:image" content="https://tenomicromochi.github.io/images/OGP.png">
    <meta property="og:url" content="https://tenomicromochi.github.io/contents/FONT/index.html">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/main.css">
    <script src="/menu.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="logo">FONT<em>DIST</em></div>
    <div class="tagline">original font distribution</div>
</header>

<div class="page-content wide">
    <h2 class="section-title">FONT DISTRIBUTION</h2>

    <div class="font-layout">

        <!-- ── 左: 書体選択 ── -->
        <aside class="col-select">
            <div class="label">FONT SELECT</div>
            <select id="font-selector" size="8"></select>
            <div id="font-meta" class="font-meta"></div>
            <button id="download-button" class="btn">DOWNLOAD</button>
        </aside>

        <!-- ── 中央: グリフ拡大 / 書体横断 / 入力 ── -->
        <section class="col-center">
            <div class="label">GLYPH</div>
            <div id="glyph-stage"><span id="glyph-big"></span></div>
            <div id="glyph-code" class="glyph-code">&nbsp;</div>

            <div class="label">ACROSS FONTS</div>
            <div id="font-strip" class="font-strip"></div>

            <div class="label">INPUT TEXT</div>
            <input type="text" id="preview-input"
                   placeholder="ここに入力した文字がプレビューされるのです">
            <div id="input-preview" class="input-preview"></div>
            <div id="missing-report" class="missing-report"></div>
        </section>

        <!-- ── 右: 文字タイル / 書体比較 ── -->
        <section class="col-chart">
            <div class="chart-head">
                <select id="page-selector"></select>
                <div class="mode-toggle">
                    <button type="button" data-mode="page" class="active">PAGE</button>
                    <button type="button" data-mode="compare">COMPARE</button>
                </div>
            </div>
            <div id="chart-scroll" class="chart-scroll">
                <div id="char-grid" class="char-grid"></div>
                <div id="compare-view" class="compare-view" hidden></div>
            </div>
            <div id="chart-status" class="chart-status"></div>
        </section>

    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
